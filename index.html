px;background:#f6f4f1;display:grid;place-items:center;color:#716c66}.stat-icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}.stat-value{font-family:Manrope,sans-serif;font-weight:700;font-size:23px;margin-top:10px;letter-spacing:-.04em}.stat-foot{font-size:10px;color:#9a9691;margin-top:2px}.overview{grid-template-columns:1.5fr 1fr;margin-bottom:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:17px 19px;border-bottom:1px solid #f3f1ef}.panel-title{font-family:Manrope,sans-serif;font-weight:700;font-size:13px}.panel-note{font-size:11px;color:var(--muted);margin-top:4px}.text-link{background:none;border:0;color:var(--orange);font-size:11px;font-weight:600;padding:4px}.empty{padding:29px 20px 31px;text-align:center}.empty-art{width:48px;height:48px;border-radius:14px;background:#fff2eb;color:var(--orange);display:grid;place-items:center;margin:0 auto 12px}.empty-art svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.empty h3{font-size:12px;margin:0 0 6px;font-weight:700}.empty p{font-size:11px;color:var(--muted);line-height:1.55;margin:0 auto 14px;max-width:290px}.empty .secondary{font-size:11px;padding:8px 11px}.setup{padding:17px 19px 18px}.setup-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #f3f1ef}.setup-row:last-child{border:0;padding-bottom:0}.check{width:20px;height:20px;border:1px solid #e4e0db;border-radius:50%;display:grid;place-items:center;color:#aaa;font-size:10px}.setup-row strong{display:block;font-size:11px;font-weight:600}.setup-row small{font-size:10px;color:var(--muted);display:block;margin-top:3px}.setup-row .arrow{margin-left:auto;color:#aaa}.section-title{font-family:Manrope,sans-serif;font-size:20px;letter-spacing:-.03em;margin:0}.page-heading{display:flex;justify-content:space-between;align-items:flex-start;margin:5px 0 24px}.page-heading p{font-size:12px;color:var(--muted);margin:7px 0 0}.toolbar{display:flex;gap:9px;align-items:center}.filter{border:1px solid var(--line);background:white;border-radius:8px;padding:10px 12px;color:#6c6864;font-size:11px}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}.table-top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.table-top strong{font-size:12px}.search{border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:11px;min-width:180px;outline:none}.search:focus,input:focus{border-color:#e88e68}.table-empty{padding:58px 20px;text-align:center}.table-empty .empty-art{margin-bottom:13px}.table-empty h3{font-size:13px;margin:0 0 6px}.table-empty p{font-size:11px;max-width:350px;color:var(--muted);line-height:1.6;margin:0 auto 15px}.feature-strip{background:#fff8f3;border:1px solid #f5e4d9;border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}.feature-strip .spark{font-size:19px}.feature-strip strong{font-size:11px}.feature-strip p{font-size:11px;color:#77716b;margin:4px 0 0;line-height:1.5}.assistant-layout{display:grid;grid-template-columns:1fr 260px;gap:15px}.chat-panel{height:520px;display:flex;flex-direction:column}.chat-intro{padding:27px 28px 8px}.chat-intro .assistant-mark{width:40px;height:40px;display:grid;place-items:center;background:#fff0e8;color:var(--orange);border-radius:12px;font-size:20px;margin-bottom:16px}.chat-intro h2{font:700 18px Manrope,sans-serif;margin:0 0 7px}.chat-intro p{font-size:12px;line-height:1.6;color:var(--muted);max-width:440px;margin:0}.suggestions{display:flex;gap:8px;flex-wrap:wrap;padding:16px 28px}.suggestions button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 11px;font-size:10px;color:#666}.chat-space{flex:1}.chat-disclaimer{margin:0 28px 12px;background:#fff8f3;padding:10px 12px;border-radius:7px;color:#82756c;font-size:10px;line-height:1.5}.chat-compose{display:flex;gap:8px;padding:0 19px 18px}.chat-compose input{flex:1;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:11px;outline:none}.chat-compose button{width:40px;border:0;border-radius:8px;background:var(--orange);color:white}.chat-compose button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}.chat-side{padding:18px}.chat-side h3{font-size:12px;margin:0 0 10px}.chat-side p{font-size:10px;color:var(--muted);line-height:1.55;margin:0 0 15px}.chat-side .divider{height:1px;background:var(--line);margin:16px 0}.modal-backdrop{position:fixed;inset:0;background:#17171766;z-index:10;display:none;place-items:center;padding:20px}.modal-backdrop.open{display:grid}.modal{width:min(470px,100%);background:#fff;border-radius:14px;padding:23px;box-shadow:var(--shadow)}.modal h2{font:700 18px Manrope,sans-serif;margin:0}.modal p{color:var(--muted);font-size:12px;line-height:1.5}.modal label{font-size:11px;font-weight:600;display:block;margin:15px 0 6px}.modal input,.modal select{width:100%;padding:11px;border:1px solid var(--line);border-radius:7px;outline:0;font-size:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:25px;bottom:24px;background:#242321;color:white;padding:12px 16px;border-radius:9px;font-size:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateY(0)}.mobile-menu{display:none}

    @media(max-width:680px){.sidebar{width:260px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.topbar{height:61px;padding:0 16px}.mobile-menu{display:grid}.crumb{margin-right:auto;margin-left:10px}.today{display:none}.content{padding:25px 16px 38px}.welcome{gap:12px}.welcome h1{font-size:23px}.welcome p{font-size:12px}.welcome>.primary{font-size:0;padding:10px}.welcome>.primary svg{width:17px;height:17px}.stats{gap:9px}.stat{padding:13px;min-height:99px}.stat-value{font-size:20px}.page-heading{gap:10px;align-items:center}.page-heading .primary{font-size:0;padding:10px}.page-heading .primary svg{width:17px;height:17px}.toolbar{display:none}.search{min-width:0;width:130px}.chat-panel{height:calc(100vh - 165px);min-height:460px}.chat-intro{padding:23px 19px 5px}.suggestions{padding:14px 19px}.chat-disclaimer{margin:0 19px 10px}.chat-compose{padding:0 13px 14px}}

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="assets/skura-bar-logo.png" alt="Logótipo SKURA BAR"><div><div class="brand-name">SKURA BAR</div><div class="brand-sub">GESTÃO DE EVENTOS</div></div></div>
    <div class="nav-label">Operação</div>
    <nav class="nav" id="nav">
      <button class="active" data-page="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/></svg>Visão geral</button>
      <button data-page="events"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Eventos</button>
      <button data-page="stock"><svg viewBox="0 0 24 24"><path d="m4 7 8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10M8 5l8 4"/></svg>Produtos & stock</button>
      <button data-page="suppliers"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 10h1m4 0h1m-6 4h1m4 0h1m-5 7v-4h2v4"/></svg>Fornecedores & faturas</button>
      <button data-page="team"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM20 8v6m3-3h-6"/></svg>Equipa & horários</button>
      <button data-page="expenses"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 8h8M8 12h8M8 16h4"/></svg>Despesas</button>
    </nav>
    <div class="nav-label">Gestão</div>
    <nav class="nav">
      <button data-page="analysis"><svg viewBox="0 0 24 24"><path d="M3 3v18h18M8 15l4-4 3 3 6-7"/></svg>Análise & margens</button>
      <button data-page="assistant"><svg viewBox="0 0 24 24"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4m0-12.8L17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="5"/></svg>Assistente IA<span class="badge">IA</span></button>
      <button data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.5.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.5-.9l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.8l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.5-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.5.9l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.8Z" transform="translate(-1 -1) scale(1.08)"/></svg>Definições</button>
    </nav>
    <div class="sidebar-bottom"><div class="assistant-teaser"><div class="teaser-top"><span class="spark">✳</span> O teu assistente SKURA</div><p>Pergunta sobre stock, custos, eventos e margens com base nos teus dados.</p><button class="teaser-link" data-goto="assistant">Abrir assistente →</button></div><div class="profile"><div class="avatar">SB</div><div><strong>Área de gestão</strong><small>Administrador</small></div></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><button class="icon-btn mobile-menu" id="menuBtn" aria-label="Abrir menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="crumb">SKURA BAR <span style="color:#ccc;margin:0 7px">/</span> <b id="breadcrumb">Visão geral</b></div><div class="top-actions"><span class="today" id="date"></span><button class="icon-btn" aria-label="Notificações" id="notice"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button></div></header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const icons={plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',box:'<svg viewBox="0 0 24 24"><path d="m4 7 8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10"/></svg>',calendar:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',spark:'✳'};
const labels={dashboard:'Visão geral',events:'Eventos',stock:'Produtos & stock',suppliers:'Fornecedores & faturas',team:'Equipa & horários',expenses:'Despesas',analysis:'Análise & margens',assistant:'Assistente IA',settings:'Definições'};
let current='dashboard';let records={events:[],stock:[],suppliers:[],team:[],expenses:[]};
const content=document.getElementById('content');
function action(label,fn='new'){return `<button class="primary" data-action="${fn}">${icons.plus}${label}</button>`}
function dashboard(){return `<div class="welcome"><div><div class="eyebrow">QUARTA-FEIRA, 14 DE OUTUBRO</div><h1>Bom dia. Vamos preparar o próximo evento.</h1><p>O teu espaço de gestão SKURA BAR, pronto para começares.</p></div>${action('Criar evento')}</div>
<div class="grid stats"><div class="stat"><div class="stat-head">Eventos ativos <span class="stat-icon">${icons.calendar}</span></div><div class="stat-value">${records.events.length}</div><div class="stat-foot">Sem eventos registados</div></div><div class="stat"><div class="stat-head">Produtos no catálogo <span class="stat-icon">${icons.box}</span></div><div class="stat-value">${records.stock.length}</div><div class="stat-foot">O teu catálogo começa aqui</div></div><div class="stat"><div class="stat-head">A preparar <span class="stat-icon">◷</span></div><div class="stat-value">0</div><div class="stat-foot">Próximos eventos</div></div><div class="stat"><div class="stat-head">Margem bruta média <span class="stat-icon">↗</span></div><div class="stat-value">—</div><div class="stat-foot">Disponível após registar custos e vendas</div></div></div>
<div class="grid overview"><section class="panel"><div class="panel-head"><div><div class="panel-title">Agenda de eventos</div><div class="panel-note">Eventos e respetivos dias de operação</div></div><button class="text-link" data-goto="events">Ver eventos →</button></div><div class="empty"><div class="empty-art">${icons.calendar}</div><h3>A agenda começa contigo</h3><p>Cria o teu primeiro evento e planeia datas, fechos diários de stock e equipa, sem limite de dias.</p><button class="secondary" data-action="new">+ Criar primeiro evento</button></div></section>
<section class="panel"><div class="panel-head"><div><div class="panel-title">Preparação inicial</div><div class="panel-note">Configura o espaço ao teu ritmo</div></div><span style="font-size:11px;color:#999">0 de 4</span></div><div class="setup"><div class="setup-row"><span class="check">1</span><div><strong>Adicionar produtos</strong><small>Catálogo, unidades e stock inicial</small></div><span class="arrow">→</span></div><div class="setup-row"><span class="check">2</span><div><strong>Registar fornecedores</strong><small>Preços, propostas e faturas</small></div><span class="arrow">→</span></div><div class="setup-row"><span class="check">3</span><div><strong>Adicionar equipa</strong><small>Valores por hora e disponibilidade</small></div><span class="arrow">→</span></div><div class="setup-row"><span class="check">4</span><div><strong>Criar primeiro evento</strong><small>Datas, turnos e fechos</small></div><span class="arrow">→</span></div></div></section></div>
<div class="feature-strip"><span class="spark">✳</span><div><strong>O teu analista SKURA, sempre à mão</strong><p>Quando os teus dados estiverem ligados, pergunta ao assistente sobre evolução de custos, melhores propostas, margens e desempenho dos eventos.</p></div></div>`}
const pages={events:{title:'Eventos',sub:'Planeia cada festa: datas, operação diária, stock e equipa.',button:'Novo evento',empty:'Ainda não tens eventos',desc:'Cria um evento para organizar todos os dias de operação, os fechos de stock e os turnos da equipa num só lugar.'},stock:{title:'Produtos & stock',sub:'Catálogo, níveis de stock e histórico de custos de compra.',button:'Adicionar produto',empty:'O teu catálogo está pronto a começar',desc:'Adiciona os teus produtos, unidades e stock inicial. Depois acompanha entradas, consumo, preços e alertas de stock mínimo.'},suppliers:{title:'Fornecedores & faturas',sub:'Contactos, propostas comerciais, promoções e compras reais.',button:'Adicionar fornecedor',empty:'Ainda não há fornecedores registados',desc:'Regista fornecedores e acompanha propostas por produto. Importa faturas para leitura assistida ou introduz os valores manualmente.'},team:{title:'Equipa & horários',sub:'Pessoas, disponibilidade, turnos e custo de equipa por evento.',button:'Adicionar pessoa',empty:'A equipa começa contigo',desc:'Adiciona as pessoas da equipa e define o valor por hora. Depois agenda turnos em cada dia de evento e acompanha horas e custos.'},expenses:{title:'Despesas',sub:'Regista os custos gerais e associa despesas a um evento.',button:'Registar despesa',empty:'Ainda não há despesas registadas',desc:'Regista despesas manualmente ou associa-as a um evento para conheceres o custo real de cada operação.'},analysis:{title:'Análise & margens',sub:'Compara custos, preços e rentabilidade dos teus produtos e eventos.',button:'Ver produtos',empty:'A análise fica disponível com os teus dados',desc:'Quando registares preços de compra e preços de venda, poderás acompanhar margem bruta, evolução de custos e comparar propostas.'},settings:{title:'Definições',sub:'Configura categorias, unidades, alertas e preferências da operação.',button:'Configurar espaço',empty:'Configura a gestão à tua maneira',desc:'Define as categorias, unidades de medida, limites de stock, regras de custo e outras opções que se adaptam ao teu negócio.'}};
function generic(key){const p=pages[key];let n=records[key]?.length||0;return `<div class="page-heading"><div><div class="eyebrow">SKURA BAR / GESTÃO</div><h1 class="section-title">${p.title}</h1><p>${p.sub}</p></div>${action(p.button)}</div>${key==='stock'?`<div class="feature-strip"><span class="spark">↗</span><div><strong>Histórico de preços e margem bruta</strong><p>Guarda propostas, promoções e preços pagos em fatura por produto e fornecedor. A análise compara os custos ao longo do tempo.</p></div></div>`:''}${key==='suppliers'?`<div class="feature-strip"><span class="spark">✳</span><div><strong>Faturas com leitura assistida</strong><p>Carrega uma fatura para extrair os dados, revê e confirma antes de atualizar o stock. Se a leitura não funcionar, podes registar tudo manualmente.</p></div></div>`:''}${key==='team'?`<div class="feature-strip"><span class="spark">◷</span><div><strong>Escalas ligadas aos eventos</strong><p>Define o valor por hora de cada pessoa e planeia os turnos por dia de evento. As horas e o custo ficam associados à festa.</p></div></div>`:''}<div class="table-wrap"><div class="table-top"><strong>${p.title} <span style="color:#aaa;font-weight:400">· ${n}</span></strong><input class="search" placeholder="Pesquisar" /></div><div class="table-empty"><div class="empty-art">${key==='events'?icons.calendar:icons.box}</div><h3>${n?p.title+' registados':p.empty}</h3><p>${p.desc}</p>${action(p.button)}</div></div>`}
function assistant(){return `<div class="page-heading"><div><div class="eyebrow">SKURA BAR / INTELIGÊNCIA</div><h1 class="section-title">Assistente SKURA</h1><p>Faz perguntas sobre o teu negócio em linguagem natural.</p></div></div><div class="assistant-layout"><section class="panel chat-panel"><div class="chat-intro"><div class="assistant-mark">✳</div><h2>Como te posso ajudar?</h2><p>Pergunta sobre custos, stock, eventos, equipa ou margens. As respostas deverão basear-se nos dados que registares no SKURA BAR.</p></div><div class="suggestions"><button>Que produtos estão a ficar mais caros?</button><button>Qual foi a margem do último evento?</button><button>Que proposta compensa mais?</button></div><div class="chat-space"></div><div class="chat-disclaimer">Pré-visualização: o assistente ainda não está ligado à base de dados nem a um serviço de IA. As respostas reais só serão ativadas quando essa ligação for configurada.</div><form class="chat-compose" id="chatForm"><input id="chatInput" placeholder="Pergunta ao assistente SKURA..." /><button aria-label="Enviar pergunta">${icons.plus}</button></form></section><aside class="panel chat-side"><h3>O que poderás perguntar</h3><p>“Qual fornecedor teve o melhor preço para este produto nos últimos três meses?”</p><p>“Quanto custou a equipa no evento de agosto?”</p><p>“Que produtos têm margem abaixo do valor que defini?”</p><div class="divider"></div><h3>Respostas com contexto</h3><p>O assistente poderá consultar os dados da empresa e indicar os registos que sustentam cada resposta.</p></aside></div>`}
function render(){document.getElementById('breadcrumb').textContent=labels[current];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===current));content.innerHTML=current==='dashboard'?dashboard():current==='assistant'?assistant():generic(current);content.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));content.querySelectorAll('[data-action="new"]').forEach(b=>b.onclick=()=>openModal(current==='dashboard'?'events':current));const f=document.getElementById('chatForm');if(f)f.onsubmit=e=>{e.preventDefault();document.getElementById('toast').textContent='O assistente será ligado quando configurarmos a ligação à IA e aos teus dados.';showToast()};}
function go(page){current=page;render();document.getElementById('sidebar').classList.remove('open');window.scrollTo(0,0)}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
function openModal(type){let title=type==='events'?'Criar evento':type==='stock'?'Adicionar produto':type==='team'?'Adicionar pessoa':type==='suppliers'?'Adicionar fornecedor':type==='expenses'?'Registar despesa':'Adicionar registo';let fields=type==='events'?'<label>Nome do evento</label><input name="name" placeholder="Ex.: nome da festa" required><label>Local</label><input name="place" placeholder="Local do evento"><label>Data de início</label><input type="date" name="date">':type==='stock'?'<label>Nome do produto</label><input name="name" placeholder="Nome do produto" required><label>Unidade de medida</label><input name="unit" placeholder="Ex.: garrafa, kg, unidade"><label>Stock inicial</label><input type="number" name="qty" min="0" placeholder="0">':type==='team'?'<label>Nome</label><input name="name" placeholder="Nome da pessoa" required><label>Valor por hora (€)</label><input type="number" name="rate" min="0" step="0.01" placeholder="0,00">':type==='suppliers'?'<label>Nome do fornecedor</label><input name="name" placeholder="Nome da empresa" required><label>Contacto</label><input name="contact" placeholder="Email ou telefone">':type==='expenses'?'<label>Descrição</label><input name="name" placeholder="Descrição da despesa" required><label>Valor (€)</label><input type="number" name="amount" min="0" step="0.01" placeholder="0,00">':'<label>Nome</label><input name="name" required placeholder="Nome">';document.getElementById('modal').innerHTML=`<h2>${title}</h2><p>Os dados ficam guardados nesta pré-visualização local. A ligação à base de dados será configurada na implementação.</p><form id="modalForm">${fields}<div class="modal-actions"><button type="button" class="secondary" id="cancel">Cancelar</button><button class="primary" type="submit">Guardar</button></div></form>`;document.getElementById('modalBackdrop').classList.add('open');document.getElementById('cancel').onclick=closeModal;document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));records[type]=records[type]||[];records[type].push(data);closeModal();render();showToast('Registo adicionado à pré-visualização')};}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};function showToast(msg){const t=document.getElementById('toast');if(msg)t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
const date=new Intl.DateTimeFormat('pt-PT',{weekday:'long',day:'numeric',month:'long'}).format(new Date());document.getElementById('date').textContent=date.charAt(0).toUpperCase()+date.slice(1);render();
</script>
</body>
</html>
